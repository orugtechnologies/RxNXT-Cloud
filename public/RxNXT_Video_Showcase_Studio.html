  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090e1a;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Device frames */
    .tablet-frame {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 12px #1e293b, 0 0 0 14px #334155;
      border-radius: 28px;
    }
    .phone-frame {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 10px #0f172a, 0 0 0 12px #334155;
      border-radius: 36px;
    }
    
    /* Pulse animations */
    @keyframes tapRipple {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .tap-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.6);
      pointer-events: none;
      animation: tapRipple 0.6s ease-out forwards;
    }

    /* Screen Transitions */
    .fade-enter {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom progress bar */
    .progress-bar-glow {
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
    }
  </style>

  <!-- Audio Context Generator for Procedural Sound Effects -->
  <script>
    // Audio synthesis context
    let audioCtx = null;
    let sfxEnabled = true;
    let voiceEnabled = true;
    let playbackSpeed = 1.0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!sfxEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'tap') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'chime') {
          // WhatsApp incoming chime simulation
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now); // E5
          osc.frequency.setValueAtTime(880.00, now + 0.1); // A5
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        }
      } catch (e) {
        // Audio error silent fallback
      }
    }

    // Voiceover Narration via Web Speech API
    let speechSynth = window.speechSynthesis;
    let currentUtterance = null;

    function speakText(text) {
      if (!voiceEnabled || !speechSynth) return;
      speechSynth.cancel(); // cancel pending

      const cleanText = text.replace(/RxNXT/g, 'Rx Next').replace(/OPD/g, 'O P D').replace(/PDF/g, 'P D F');
      currentUtterance = new SpeechSynthesisUtterance(cleanText);
      currentUtterance.rate = 1.05 * playbackSpeed;
      currentUtterance.pitch = 1.0;
      
      // Prefer Indian English or standard natural voice
      const voices = speechSynth.getVoices();
      const inVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('en_IN'));
      if (inVoice) currentUtterance.voice = inVoice;

      speechSynth.speak(currentUtterance);
    }
  </script>

    let isPlaying = false;
    let currentTime = 0; // seconds

    let animTimer = null;
    let lastTimestamp = 0;

    // --- VIDEO DEFINITIONS ---
    const VIDEOS = {
      // 1. The 60s Core Pitch (16:9)
      v1: {

        duration: 30,
        scenes: [
          {
            id: 1,
            start: 0,
            end: 6,
            tag: 'REEL 1: PEN VS DIGITAL',
            subtitle: 'Still writing prescriptions with a pen in 2026? Switch to 15-second digital prescribing.',
            render: renderV2Scene1

            subtitle: 'Type "PCM" -> Tap 1-0-1 -> 3 Days -> Done! Official letterhead and digital signature formatted automatically.',
            render: renderV2Scene2
          },
          {
            id: 3,
            start: 18,
            end: 26,
            tag: 'REEL 3: WHATSAPP SUPER-PRESCRIPTION',
            subtitle: 'One click sends the branded PDF and dose instructions directly to your patient on WhatsApp!',
            render: renderV2Scene3
          },
          {

            start: 26,
            end: 30,
            tag: 'REEL 4: CLAIM 150 FREE RX',
            subtitle: 'Get 150 Free Prescriptions today at www.rxnxt.in. Zero card required.',
            render: renderV2Scene4
          }
        ]
      },

      // 3. The 2-Min Walkthrough (16:9)
      v3: {
        id: 'v3',
        title: 'The 2-Minute Full Clinical Walkthrough',
        aspect: '16:9',
        duration: 120,
        scenes: [
          {
            id: 1,
            start: 0,
            end: 22,
            tag: 'WALKTHROUGH 1: FRONT-DESK QUEUE',
            subtitle: 'Module 1: Front-desk token queue & triage. Fast patient registration and vitals entry before consultation.',
            render: renderV3Scene1
          },
          {

            end: 60,
            tag: 'WALKTHROUGH 2: DOCTOR CLINICAL WORKSPACE',
            subtitle: 'Module 2: Additive drug search, doctor habit scoring, Schedule X narcotic blocking, and protocol bundles.',
            render: renderV3Scene2
          },
          {

            end: 85,
            tag: 'WALKTHROUGH 3: LIVE A4 PREVIEW & WHATSAPP',
            subtitle: 'Module 3: Instant client-side PDF rendering (<250ms) and direct Meta Cloud API WhatsApp dispatches.',
            render: renderV3Scene3
          },
          {

            start: 85,
            end: 105,
            tag: 'WALKTHROUGH 4: IN-HOUSE PHARMACY & DISPENSING',
            subtitle: 'Module 4: In-clinic pharmacy inventory, batch stock tracking, and direct-to-dispense billing.',
            render: renderV3Scene4
          },
          {
            id: 5,
            start: 105,
            end: 120,
            tag: 'WALKTHROUGH 5: PRACTICE ANALYTICS & TIERS',
            subtitle: 'Module 5: High-speed practice analytics and transparent tiers: Solo GP, Specialist, and Polyclinic Hub.',
            render: renderV3Scene5
          }
        ]
      }
    };

    // Switch between V1, V2, V3
    function switchVideo(vKey) {
      activeVideo = vKey;
      currentTime = 0;
      totalDuration = VIDEOS[vKey].duration;

      // Update Tab Styles
      ['v1', 'v2', 'v3'].forEach(k => {
        const btn = document.getElementById(`tab-${k}`);
        if (k === vKey) {
          btn.className = 'px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow-md';
        } else {
          btn.className = 'px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white';
        }
      });

      // Update Aspect Ratio of Stage
      const container = document.getElementById('player-container');
      if (VIDEOS[vKey].aspect === '9:16') {
        container.className = 'relative w-[360px] aspect-[9/16] bg-slate-950 rounded-[40px] border border-slate-800 overflow-hidden shadow-2xl flex items-center justify-center transition-all duration-500';
      } else {
        container.className = 'relative w-full aspect-video max-h-[640px] bg-slate-950 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl flex items-center justify-center transition-all duration-500';
      }

      document.getElementById('time-total').innerText = formatTime(totalDuration);
      updateTeleprompter();
      renderCurrentFrame();
    }

    // Play / Pause Toggle
    function togglePlay() {
      initAudio();
      isPlaying = !isPlaying;

      const centerBtn = document.getElementById('center-play-btn');
      const btnLabel = document.getElementById('btn-play-label');

      if (isPlaying) {
        centerBtn.classList.add('opacity-0', 'pointer-events-none');
        btnLabel.innerText = '⏸ Pause Video';
        lastTimestamp = performance.now();
        requestAnimationFrame(tick);
      } else {
        centerBtn.classList.remove('opacity-0', 'pointer-events-none');
        btnLabel.innerText = '▶ Play Video';
        if (speechSynth) speechSynth.pause();
      }
    }

    function restartVideo() {
      currentTime = 0;
      if (speechSynth) speechSynth.cancel();
      renderCurrentFrame();
      if (!isPlaying) togglePlay();
    }

    function seekVideo(event) {
      const track = document.getElementById('timeline-track');
      const rect = track.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      currentTime = ratio * totalDuration;
      renderCurrentFrame();
    }

    function setSpeed(spd) {
      playbackSpeed = spd;
      [1.0, 1.25, 1.5].forEach(s => {
        const id = s === 1.0 ? 'spd-1' : (s === 1.25 ? 'spd-125' : 'spd-15');
        const b = document.getElementById(id);
        if (s === spd) {
          b.className = 'px-2.5 py-1 rounded-lg font-bold text-white bg-blue-600';
        } else {
          b.className = 'px-2.5 py-1 rounded-lg font-bold text-slate-400 hover:text-white';
        }
      });
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const label = document.getElementById('voice-label');
      const icon = document.getElementById('voice-icon');
      if (voiceEnabled) {
        label.innerText = 'Voiceover: ON';
        icon.innerText = '🔊';
      } else {
        label.innerText = 'Voiceover: OFF';
        icon.innerText = '🔇';
        if (speechSynth) speechSynth.cancel();
      }
    }

    function toggleSFX() {
      sfxEnabled = !sfxEnabled;
      document.getElementById('sfx-label').innerText = sfxEnabled ? 'Sound FX: ON' : 'Sound FX: OFF';
    }

    // Main animation loop
    function tick(now) {
      if (!isPlaying) return;

      const delta = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      currentTime += delta * playbackSpeed;

      if (currentTime >= totalDuration) {
        currentTime = totalDuration;
        isPlaying = false;
        document.getElementById('center-play-btn').classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('btn-play-label').innerText = '▶ Play Video';
        renderCurrentFrame();
        return;
      }

      renderCurrentFrame();
      requestAnimationFrame(tick);
    }

    let lastSpokenSceneId = null;

    function renderCurrentFrame() {
      // Update Timeline Bar
      const progress = (currentTime / totalDuration) * 100;
      document.getElementById('timeline-progress').style.width = `${progress}%`;
      document.getElementById('time-current').innerText = formatTime(currentTime);

      const videoDef = VIDEOS[activeVideo];
      const scene = videoDef.scenes.find(s => currentTime >= s.start && currentTime < s.end) || videoDef.scenes[videoDef.scenes.length - 1];

      // Update Scene Tag & Subtitle
      document.getElementById('scene-tag').innerText = scene.tag;
      const subEl = document.getElementById('subtitle-text');
      if (subEl.innerText !== scene.subtitle) {
        subEl.innerText = scene.subtitle;
        subEl.parentElement.classList.remove('fade-enter');
        void subEl.parentElement.offsetWidth; // trigger reflow
        subEl.parentElement.classList.add('fade-enter');
      }

      // Voiceover trigger on scene change
      if (lastSpokenSceneId !== `${activeVideo}-${scene.id}` && isPlaying) {
        lastSpokenSceneId = `${activeVideo}-${scene.id}`;
        speakText(scene.subtitle);
      }

      // Render Stage Content
      const stage = document.getElementById('video-stage');
      const sceneTime = currentTime - scene.start;
      const sceneDuration = scene.end - scene.start;
      scene.render(stage, sceneTime, sceneDuration);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // ========================================================

    function renderV1Scene1(stage, t, dur) {
      stage.innerHTML = `
        <div class="flex flex-col items-center justify-center p-6 text-center max-w-xl fade-enter">
          <div class="h-16 w-16 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-500 flex items-center justify-center text-3xl mb-4 shadow-xl">
            ✍️

              <div class="text-emerald-400 font-extrabold">₹12,999/yr</div>
            </div>
            <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
              <div class="font-bold text-white">Polyclinic</div>
              <div class="text-purple-400 font-extrabold">₹24,999/yr</div>
            </div>
          </div>
          <span class="text-xs text-slate-400">All tiers include The First 150 Free Prescriptions</span>
        </div>
      `;
    }

    // Update Teleprompter Scenes List
    function updateTeleprompter() {
      const vDef = VIDEOS[activeVideo];
      const container = document.getElementById('teleprompter-content');
      container.innerHTML = vDef.scenes.map((s, idx) => `
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-left space-y-1">
          <div class="flex items-center justify-between text-[10px] text-blue-400 font-bold">
            <span>SCENE ${s.id}</span>
            <span>${formatTime(s.start)} - ${formatTime(s.end)}</span>
          </div>
          <div class="font-bold text-white text-[11px]">${s.tag.replace(/SCENE \d+: |REEL \d+: |WALKTHROUGH \d+: /, '')}</div>
          <div class="text-[10px] text-slate-400 line-clamp-3">${s.subtitle}</div>
        </div>
      `).join('');
    }

    // ========================================================
    // VIDEO RECORDER ENGINE (HTML5 MediaRecorder -> .webm)
    // ========================================================
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    async function toggleRecording() {
      const recBtn = document.getElementById('record-btn');
      const recLabel = document.getElementById('record-label');

      if (!isRecording) {
        try {
          // Ask for stream or capture stage
          const stageEl = document.getElementById('player-container');
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: 60, displaySurface: 'browser' },
            audio: false
          });

          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `RxNXT_${activeVideo}_presentation.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
              document.body.removeChild(a);
              window.URL.revokeObjectURL(url);
            }, 100);

            isRecording = false;
            recLabel.innerText = 'Export / Record Video (.webm)';
            recBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
            recBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
          };

          mediaRecorder.start();
          isRecording = true;
          recLabel.innerText = '🔴 Recording... Click to Stop & Save';
          recBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
          recBtn.classList.add('bg-rose-600', 'hover:bg-rose-500');

          // Auto restart video from start
          restartVideo();

        } catch (err) {
          alert('Screen capture cancelled or not supported in this browser mode.');
        }
      } else {
        mediaRecorder.stop();
      }
    }

    // Initial setup on load
    window.addEventListener('DOMContentLoaded', () => {
      switchVideo('v1');
    });
  </script>
